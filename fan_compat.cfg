# M106/M107 compatibility.
# This printer has no [fan] section (part cooling is [fan_generic fan0]), so Klipper
# never registers M106/M107 and every slicer fan command was silently discarded.
# P0 (default) = fan0, the toolhead part cooling fan.  P2 = fan2, the auxiliary fan.

[gcode_macro M106]
description: Set part cooling fan speed (S0-255, optional P fan index)
gcode:
    {% set s = [[(params.S|default(255)|float) / 255.0, 0.0]|max, 1.0]|min %}
    {% if params.P|default(0)|int == 2 %}
      SET_FAN_SPEED FAN=fan2 SPEED={s}
    {% else %}
      SET_FAN_SPEED FAN=fan0 SPEED={s}
    {% endif %}

[gcode_macro M107]
description: Turn off part cooling fan
gcode:
    {% if params.P|default(0)|int == 2 %}
      SET_FAN_SPEED FAN=fan2 SPEED=0
    {% else %}
      SET_FAN_SPEED FAN=fan0 SPEED=0
    {% endif %}

# Orca emits a bare T0 from the filament custom gcode. This printer has a single
# [extruder], so Klipper never registers T0 and logs "Unknown command". Nothing is
# lost - there is no second tool to select - this just silences it so a real
# unknown-command error stays visible.
[gcode_macro T0]
description: No-op tool select (single extruder)
gcode:
